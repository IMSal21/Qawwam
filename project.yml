name: Qawwam
options:
  bundleIdPrefix: com.qawwam
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
packages:
  QawwamCore:
    path: QawwamCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Qawwam:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: QawwamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qawwam.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: قوّام
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme: {}
