name: iOS

on:
  push:
    branches-ignore: [screenshots]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: iOS app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -project Qawwam.xcodeproj -scheme Qawwam \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -n 80
      - name: Pick an iPhone simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((runtime, d["udid"]) for runtime, list_ in devices.items() if "iOS" in runtime
                       for d in list_ if d["name"].startswith("iPhone"))
          print(ios[-1][1] if ios else "")')
          if [ -z "$device" ]; then
            runtime=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          ios = [r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS"]
          print(ios[-1])')
            device=$(xcrun simctl create "Qawwam iPhone" "iPhone 16" "$runtime")
          fi
          echo "Using simulator $device"
          echo "SIMULATOR_ID=$device" >> "$GITHUB_ENV"
      - name: Test on an iPhone simulator
        run: |
          set -o pipefail
          xcodebuild test -project Qawwam.xcodeproj -scheme Qawwam \
            -destination "id=$SIMULATOR_ID" -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO | tail -n 80
      - name: Export screenshots
        if: success()
        run: |
          mkdir -p build/attachments build/screenshots
          xcrun xcresulttool export attachments --path build/Results.xcresult --output-path build/attachments
          python3 - <<'PY'
          import json, shutil
          manifest = json.load(open("build/attachments/manifest.json"))
          for test in manifest:
              for item in test.get("attachments", []):
                  name = item["suggestedHumanReadableName"].split("_")[0]
                  shutil.copy(f"build/attachments/{item['exportedFileName']}", f"build/screenshots/{name}.png")
          PY
          ls -l build/screenshots
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: screenshots
          path: build/screenshots
      - name: Post screenshots on the pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then echo "No open pull request for $GITHUB_REF_NAME"; exit 0; fi
          shots="$RUNNER_TEMP/shots"
          git init -q "$shots" && cd "$shots"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin screenshots; then git checkout -q -b screenshots FETCH_HEAD; else git checkout -q --orphan screenshots; fi
          mkdir -p "$GITHUB_SHA" && cp "$GITHUB_WORKSPACE"/build/screenshots/*.png "$GITHUB_SHA"/
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q origin screenshots
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/screenshots/${GITHUB_SHA}"
          {
            echo "### Screenshots for ${GITHUB_SHA:0:7}"
            echo
            echo "| العربية | English |"
            echo "|---|---|"
            echo "| <img src=\"$base/today-ar.png\" width=\"280\"> | <img src=\"$base/today-en.png\" width=\"280\"> |"
            for screen in farm; do
              if [ -f "$GITHUB_WORKSPACE/build/screenshots/$screen-ar.png" ]; then
                echo "| <img src=\"$base/$screen-ar.png\" width=\"280\"> | <img src=\"$base/$screen-en.png\" width=\"280\"> |"
              fi
            done
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --edit-last --body-file "$RUNNER_TEMP/comment.md" \
            || gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
